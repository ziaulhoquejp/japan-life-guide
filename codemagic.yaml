workflows:
ios:
name: iOS
max_build_duration: 60
instance_type: mac_mini_m1
scripts:
- name: install node
script: node --version
- name: install pnpm
script: npm install -g pnpm
- name: install deps
script: pnpm install
- name: cap sync
script: npx cap sync ios
- name: pod install
script: cd ios/App && pod install
- name: build
script: |
xcodebuild \
-workspace ios/App/App.xcworkspace \
-scheme App \
-sdk iphoneos \
-configuration Release \
build \
CODE_SIGNING_ALLOWED=NO
artifacts:
- ios/App/build/**/*.ipa
