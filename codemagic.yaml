workflows:
  ios:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1  # <--- Added back here
    scripts:
      - name: pnpm
        script: npm install -g pnpm
      - name: deps
        script: pnpm install
      - name: sync
        script: npx cap sync ios
      - name: pods
        script: cd ios/App && pod install
    artifacts:
      - ios/App/build/**/*.ipa