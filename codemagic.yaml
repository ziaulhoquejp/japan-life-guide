workflows:
ios-workflow:
name: iOS Build
max_build_duration: 60
scripts:
- name: Install pnpm
script: npm install -g pnpm
- name: Install dependencies
script: pnpm install
- name: Build
script: pnpm build
- name: Cap sync
script: npx cap sync ios
- name: Pod install
script: cd ios/App && pod install
- name: Build IPA
script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
artifacts:
- build/ios/ipa/*.ipa