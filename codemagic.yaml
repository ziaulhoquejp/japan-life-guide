workflows:
  ios:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      # 1. IMPORT YOUR API KEYS HERE
      groups:
        - appstore_credentials # Create this group in your Codemagic UI settings
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.japanlifeguide.www
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync ios
      # 2. Run Pod install inside the iOS directory before configuring signing
      - name: Pod install
        script: |
          cd ios/App
          pod install
      - name: Set up code signing
        script: |
          keychain initialize
          # 3. Pass the required credentials (populated from your environment group)
          app-store-connect fetch-signing-files \
            "app.japanlifeguide.www" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # 4. Target the WORKSPACE (.xcworkspace) instead of the .xcodeproj
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
  android:
    name: Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 21
      android_signing:
        - Japan Life Guide
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Sign AAB
        script: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore $CM_KEYSTORE_PATH \
            -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD \
            android/app/build/outputs/bundle/release/app-release.aab \
            $CM_KEY_ALIAS
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
