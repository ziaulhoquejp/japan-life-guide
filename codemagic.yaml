workflows:
  ios:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          touch yarn.lock
          yarn install --no-immutable
      - name: Sync/Add Capacitor iOS Platform
        script: |
          # Check if the ios folder exists. If not, add it first.
          if [ ! -d "ios" ]; then
            echo "iOS platform folder not found. Adding it now..."
            yarn cap add ios
          else
            echo "iOS platform folder found. Syncing..."
          fi
          yarn cap sync ios
      - name: CocoaPods installation
        script: |
          PODFILE_DIR=$(find . -name "Podfile" -not -path "*/node_modules/*" -exec dirname {} \;)
          if [ -z "$PODFILE_DIR" ]; then
            echo "Error: Could not find a Podfile anywhere in the project!"
            exit 1
          fi
          echo "Found Podfile in: $PODFILE_DIR"
          cd "$PODFILE_DIR"
          pod install
      - name: Build iOS App
        script: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "Error: Could not find an .xcworkspace file!"
            exit 1
          fi
          echo "Building workspace: $WORKSPACE_PATH"
          
          xcodebuild \
          -workspace "$WORKSPACE_PATH" \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          build \
          CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.ipa