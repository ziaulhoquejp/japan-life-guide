workflows:
ios:
name: iOS
max_build_duration: 60
instance_type: mac_mini_m1
environment:
node: latest
xcode: latest
cocoapods: default
ios_signing:
distribution_type: app_store
bundle_identifier: app.japanlifeguide.www
scripts:
- name: Install dependencies
script: npm install
- name: Sync Capacitor
script: npx cap sync ios
- name: CocoaPods
script: cd ios/App && pod install
- name: Build IPA
script: |
xcode-project build-ipa \
--workspace ios/App/App.xcworkspace \
--scheme App
artifacts:
- build/ios/ipa/*.ipa
publishing:
app_store_connect:
auth: integration
