workflows:
  ios:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          touch yarn.lock
          yarn install --no-immutable  # Matches your Yarn 4 project setup
      - name: Sync Capacitor project
        script: npx cap sync ios
      - name: CocoaPods installation
        script: |
          cd ios/App
          pod install
      - name: Build iOS App
        script: |
          xcodebuild \
          -workspace ios/App/App.xcworkspace \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          build \
          CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.ipa