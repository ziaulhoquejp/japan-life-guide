workflows:
  ios:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1  # Required to run Xcode builds
    scripts:
      - name: deps
        script: pnpm install
      - name: sync
        script: npx cap sync ios
      - name: pods
        script: cd ios/App && pod install
      - name: build              # Added build step back in
        script: |
          xcodebuild \
          -workspace ios/App/App.xcworkspace \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          build \
          CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.ipa