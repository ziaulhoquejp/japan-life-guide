- name: Build iOS App
        script: |
          APP_PATH=$(find /Users/builder/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Release-iphoneos/*" | head -n 1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload
          echo "IPA created!"
    artifacts:
      - App.ipa
