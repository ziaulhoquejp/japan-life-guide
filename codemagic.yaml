workflows:
  ios:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.japanlifeguide.www
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Application
        script: npm run build # 👈 CRITICAL: Compiles your React/Vue/Angular web assets first
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - "ios/App/build/ios/ipa/*.ipa" # 👈 Optimized: Specific path instead of a slow global search
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
